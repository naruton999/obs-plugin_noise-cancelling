name: Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Build release DLL
        run: cargo build -p obs-filter --release --target x86_64-pc-windows-msvc

      - name: Prepare DLL
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/obs_filter.dll dist/windows/obs-plugin_noise-cancelling.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-plugin_noise-cancelling-windows-x64-dll
          path: dist/windows/
          if-no-files-found: error
