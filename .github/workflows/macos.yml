name: macOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for macOS arm64 (best effort)
    runs-on: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Check formatting
        run: cargo fmt --check

      - name: Run df-core tests
        run: cargo test -p df-core

      - name: Run obs-filter tests
        run: cargo test -p obs-filter

      - name: Run clippy
        run: cargo clippy -p obs-filter --all-targets --target aarch64-apple-darwin -- -D warnings

      - name: Package .plugin
        run: ./build-aux/package-macos.sh

      - name: Verify .plugin bundle
        run: |
          PLUGIN=dist/obs-plugin_noise-cancelling.plugin
          test -d "$PLUGIN"
          test -f "$PLUGIN/Contents/Info.plist"
          test -f "$PLUGIN/Contents/MacOS/obs-plugin_noise-cancelling"
          test -f "$PLUGIN/Contents/Resources/models/DeepFilterNet3_ll_onnx.tar.gz"
          test -f "$PLUGIN/Contents/Resources/models/DeepFilterNet3_onnx.tar.gz"
          test -f "$PLUGIN/Contents/Resources/presets/hybrid.toml"
          plutil -lint "$PLUGIN/Contents/Info.plist"

      - name: Check architecture
        run: file dist/obs-plugin_noise-cancelling.plugin/Contents/MacOS/obs-plugin_noise-cancelling | grep arm64

      - name: Prepare artifact
        run: |
          rm -rf dist/artifact
          mkdir -p dist/artifact
          ditto dist/obs-plugin_noise-cancelling.plugin dist/artifact/obs-plugin_noise-cancelling.plugin

      - name: Upload .plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-plugin_noise-cancelling-macos-arm64
          path: dist/artifact/
          if-no-files-found: error
