name: macOS Build

on:
  workflow_dispatch:
    inputs:
      embed_models:
        description: "Embed both DeepFilterNet models in the plugin"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build for macOS arm64 (best effort)
    runs-on: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Check formatting
        run: cargo fmt --check

      - name: Run df-core tests
        run: cargo test -p df-core

      - name: Run obs-filter tests
        run: cargo test -p obs-filter

      - name: Run clippy
        run: cargo clippy -p obs-filter --all-targets --target aarch64-apple-darwin -- -D warnings

      - name: Fetch models
        run: ./scripts/fetch-models.sh

      - name: Package
        env:
          EMBED_MODELS: ${{ inputs.embed_models && '1' || '0' }}
        run: ./build-aux/package-macos.sh

      - name: Check architecture
        run: file dist/obs-plugin_noise-cancelling.plugin/Contents/MacOS/obs-plugin_noise-cancelling | grep arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-plugin_noise-cancelling-macos-arm64
          path: dist/obs-plugin_noise-cancelling.plugin
          if-no-files-found: error
