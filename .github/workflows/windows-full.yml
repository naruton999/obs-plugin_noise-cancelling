name: Windows Build (Full package)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build full package for Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Build release DLL
        run: cargo build -p obs-filter --release --target x86_64-pc-windows-msvc

      - name: Build full package
        run: ./build-aux/package-windows.ps1 -Configuration Release -SkipBuild

      - name: Upload full package artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-plugin_noise-cancelling-windows-x64-full
          path: dist/windows/
          if-no-files-found: error
