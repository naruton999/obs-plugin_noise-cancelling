name: Manual Format & Build
run-name: ${{ github.ref_name }} manual run 🚀
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref_name }}'
  cancel-in-progress: true
jobs:
  check-format:
    name: Check Formatting 🔍
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read
